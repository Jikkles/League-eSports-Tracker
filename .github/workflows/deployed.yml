name: Deploy check

# GitHub Pages rebuilds on every push to main, and nothing in this repo ever
# looked at the result. When a rebuild does not happen — a Pages incident, a
# changed setting, a build queued behind another — every check stays green while
# the live page serves the previous version indefinitely. That combination, all
# green and quietly stale, is the one no other job here would catch.
#
# So after each push to main, wait for the rebuild and prove the deployed bytes
# are the ones just pushed. Also runs daily, because a deploy can be rolled back
# or a settings change can strand the site long after the push that built it.
#
# And after each generator, for the reason spelled out in smoke.yml: a push made
# with GITHUB_TOKEN raises no `push` event, so the three jobs that write to
# index.html unattended were the ones whose deploys nothing confirmed — the
# daily run was the only thing that would ever have noticed, up to 24 hours
# later.

on:
  push:
    branches: [main]
    paths: ['index.html']
  schedule:
    - cron: '45 8 * * *'
  workflow_run:
    workflows: [Refresh drafts, Refresh power rankings, Refresh the qualification board]
    types: [completed]
  workflow_dispatch:

# One at a time, and never cancel: two generators landing close together would
# otherwise leave the survivor proving a build that has already been replaced.
concurrency:
  group: deployed
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

env:
  TITLE: 'Deploy: GitHub Pages is serving a stale build'
  LABEL: deploy-stale

jobs:
  # Same question smoke.yml's guard asks: did the generator actually push? Its
  # head_sha is where it started, so main having moved past it is the answer.
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      # Only a workflow_run run has anything to look up; on a push or a PR this
      # job is a three-line script, so do not pay for a checkout it will not
      # read. It gates the real job, which means it is on the critical path of
      # every commit.
      - uses: actions/checkout@v7
        if: github.event_name == 'workflow_run'
        with:
          ref: ${{ github.event.workflow_run.head_branch || '' }}

      - id: decide
        env:
          KIND: ${{ github.event_name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          FROM: ${{ github.event.workflow_run.head_sha }}
          WHO: ${{ github.event.workflow_run.name }}
        run: |
          if [ "$KIND" != "workflow_run" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$CONCLUSION" != "success" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "$WHO finished $CONCLUSION; nothing was deployed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          head=$(git rev-parse HEAD)
          if [ "$head" = "$FROM" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "$WHO had nothing to commit; no deploy to confirm." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "$WHO pushed \`${head:0:7}\`; confirming it reaches Pages." >> "$GITHUB_STEP_SUMMARY"
          fi

  deployed:
    needs: guard
    if: needs.guard.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_branch || '' }}

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      # A push waits for the rebuild; a scheduled run should already be live and
      # only needs one look, so it fails fast rather than sitting for 8 minutes.
      - name: Check the live site against this commit
        id: probe
        run: |
          # a run following a real push waits out the rebuild; the daily audit
          # asks about a site that has had all day to catch up
          case "${{ github.event_name }}" in
            push|workflow_run) TIMEOUT=480 ;;
            *)                 TIMEOUT=60  ;;
          esac
          if node tools/deployed.mjs --timeout "$TIMEOUT" > deployed-log.txt 2>&1; then
            echo "healthy=true" >> "$GITHUB_OUTPUT"
          else
            echo "healthy=false" >> "$GITHUB_OUTPUT"
          fi
          cat deployed-log.txt
          {
            echo '```'
            cat deployed-log.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Write the report
        if: steps.probe.outputs.healthy == 'false'
        run: |
          {
            echo "GitHub Pages is not serving the current \`main\`. The repo is green, every other check passes, and <https://jikkles.github.io/League-eSports-Tracker/> is showing an older build."
            echo
            echo "Checked against commit \`${{ github.sha }}\`."
            echo
            echo '```'
            cat deployed-log.txt
            echo '```'
            echo
            echo "Where to look: **Settings → Pages** for the source branch and the last build, the repository's deployment history, and <https://www.githubstatus.com> for an incident."
            echo
            echo "Reproduce locally with \`node tools/deployed.mjs\`."
            echo
            echo "<sub>Posted by [deployed.yml](../blob/main/.github/workflows/deployed.yml). Updated in place on each run, and closed automatically once the live site catches up.</sub>"
          } > deployed-report.md

      - name: Report
        uses: ./.github/actions/report-issue
        with:
          healthy: ${{ steps.probe.outputs.healthy }}
          label: ${{ env.LABEL }}
          title: ${{ env.TITLE }}
          body-file: deployed-report.md
          color: 5319E7
          description: Raised automatically when the deployed Pages site does not match main
          token: ${{ github.token }}

      - name: Fail the run if the deploy has not landed
        if: steps.probe.outputs.healthy == 'false'
        run: exit 1
