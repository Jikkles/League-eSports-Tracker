name: Refresh the qualification board

# Who has already qualified for Worlds is not an editorial question, it is a
# consequence of results — and Riot publishes both the results and the bracket
# wiring they run through. tools/qual.mjs reads that wiring, works out how far
# each team can still fall, and writes the ones who can no longer fall out of
# their region's places into the QUAL block in index.html.
#
# Every two hours rather than nightly, because the thing it is watching for is a
# series ending. A daily job would leave the board a day behind the broadcast
# that everyone watched, which is the whole problem it exists to solve.
#
# It only ever adds teams and narrows seed ranges. Anything it cannot prove — a
# place that is not a bracket placement, an answer that contradicts what is
# written by hand — it reports and leaves alone, so a wrong rulebook assumption
# shows up as a stalled board rather than as a false claim on the live site.

on:
  schedule:
    - cron: '20 */2 * * *'
  workflow_dispatch:

# index.html is rewritten in place; never let two jobs race for it
concurrency:
  group: qual
  cancel-in-progress: false

permissions:
  contents: write
  issues: write        # to raise a failed run rather than leave it in the Actions tab

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          # the push below may need to rebase, and a depth-1 clone has no
          # merge base to rebase onto
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Work out who is through and patch index.html
        id: qual
        # One retry, ten minutes on, for the same reason as drafts.yml: an
        # upstream that is unreachable for a few minutes should not open an
        # issue. Nothing is written until the tool finishes.
        run: |
          : > qual-log.txt
          for attempt in 1 2; do
            echo "--- attempt $attempt" >> qual-log.txt
            if node tools/qual.mjs >> qual-log.txt 2>&1; then
              healthy=true; break
            fi
            healthy=false
            if [ "$attempt" = 1 ]; then sleep 600; fi
          done
          echo "healthy=$healthy" >> "$GITHUB_OUTPUT"
          cat qual-log.txt
          {
            echo '```'
            cat qual-log.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The block is rewritten wholesale and it makes a claim about a team, so a
      # bad write is worse than a broken page. Check before committing.
      #
      # A check that fails here is as much a failed refresh as an unreachable
      # API — the block has been rewritten in the working copy and it is not fit
      # to push — so it goes through the same report rather than straight to a
      # red run. It did not, and the gap cost a week of silent failures: on
      # 19 September 2026 qual.mjs started deriving an LPL seed that `EVENT.qual`
      # says is impossible, and because the tool itself succeeded, every run
      # from then on closed the issue, failed at this step and left nothing
      # behind but an Actions email — every two hours, with no issue to read.
      - name: Check the page still parses and the board still adds up
        id: verify
        if: steps.qual.outputs.healthy == 'true'
        run: |
          if node tools/check.mjs > check-log.txt 2>&1; then
            echo "healthy=true" >> "$GITHUB_OUTPUT"
          else
            echo "healthy=false" >> "$GITHUB_OUTPUT"
          fi
          cat check-log.txt
          {
            echo "--- tools/check.mjs"
            cat check-log.txt
          } >> qual-log.txt
          {
            echo '```'
            cat check-log.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # One verdict for the two ways this job can fail, because the issue below
      # takes one flag. A skipped verify step reports an empty string, which is
      # the refresh having failed first.
      - name: Settle the verdict
        id: verdict
        env:
          REFRESH: ${{ steps.qual.outputs.healthy }}
          VERIFY: ${{ steps.verify.outputs.healthy }}
        run: |
          if [ "$REFRESH" = true ] && [ "$VERIFY" = true ]; then
            echo "healthy=true" >> "$GITHUB_OUTPUT"
          else
            echo "healthy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Write the report
        if: steps.verdict.outputs.healthy == 'false'
        env:
          REFRESH: ${{ steps.qual.outputs.healthy }}
        run: |
          {
            if [ "$REFRESH" != true ]; then
              echo "The qualification refresh failed, so the board on the Worlds tab of [index.html](../blob/main/index.html) is frozen at whatever it last worked out."
              echo
              echo "Nothing on the page is broken — it draws the teams it already has, and the hand-written half of \`EVENT.qual\` is untouched either way. The usual cause is the lolesports API being briefly unreachable, which clears on its own; the [api-canary](../issues?q=label%3Aapi-canary) issue is the place to check if it does not."
              echo
              echo "The failure this one cannot survive is a change in how Riot files a bracket. \`qual.mjs\` finds each region's stage by the slug in \`EVENT.qual.regions[].routes[].at.stage\`, and a stage that has been renamed or a season filed under a new tournament reads as *stage \"…\" is not in … yet*. That is a one-line fix to the constant, not to the tool."
            else
              echo "\`tools/qual.mjs\` ran, but the board it wrote does not pass \`tools/check.mjs\`, so nothing has been committed and the live page is still serving the last board that did."
              echo
              echo "This is the half worth reading closely, because it does not clear on its own: the tool is deriving something \`EVENT.qual\` says is impossible, and it will derive the same thing on every run until one of the two is changed. \`check.mjs\`'s message below names the region, the team and the seed."
              echo
              echo "Two answers, and which one is right is a question about the rules rather than about the run. Either the bracket really does settle that place and the routes in \`EVENT.qual\` are wrong, or the routes are right and \`qual.mjs\` is reading the bracket wrong — remember that \`routes[].at.place\` is a placement *inside a stage* while a seed is an index into \`routes\`, and that the two only coincide where a region's places all come out of one bracket in order."
            fi
            echo
            echo '```'
            cat qual-log.txt
            echo '```'
            echo
            echo "Reproduce locally with \`node tools/qual.mjs --dry-run\` and \`node tools/check.mjs\`."
            echo
            echo "<sub>Posted by [qual.yml](../blob/main/.github/workflows/qual.yml). Updated in place on each run, and closed automatically once a run succeeds.</sub>"
          } > qual-report.md

      - name: Report
        uses: ./.github/actions/report-issue
        with:
          healthy: ${{ steps.verdict.outputs.healthy }}
          label: qual-failing
          title: 'Qualification board: the bracket read is failing'
          body-file: qual-report.md
          color: 'FBCA04'
          description: Raised automatically when the qualification refresh cannot complete
          token: ${{ github.token }}

      # Only where somebody is standing there waiting for the answer. A red
      # scheduled run mails whoever last touched this file, once per run, and
      # this one runs twelve times a day — so a fault that lasts a week is one
      # issue and eighty-odd emails, which trains the reader to bin all of them
      # including the first. The issue above is the signal, the same rule
      # stale.yml and links.yml already state. A dispatch stays red, because the
      # person who clicked it is watching the tab.
      - name: Stop here if the run failed
        if: steps.verdict.outputs.healthy == 'false' && github.event_name != 'schedule'
        run: exit 1

      - name: Summarise
        if: steps.verdict.outputs.healthy == 'false'
        run: echo "The qualification refresh did not land — see the [qual-failing](../issues?q=label%3Aqual-failing) issue." >> "$GITHUB_STEP_SUMMARY"

      # Nothing below this line may run on a failed refresh, and until now
      # nothing had to say so: the exit above stopped the job outright. It no
      # longer does on a schedule, so the guard has to be here.
      - name: Commit if anything changed
        if: steps.verdict.outputs.healthy == 'true'
        run: |
          if git diff --quiet -- index.html; then
            echo "board unchanged; nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -F - <<'MSG'
          Update the Worlds qualification board

          Written by tools/qual.mjs from Riot's published bracket wiring: a team
          is added once no result can drop it out of its region's places, and a
          seed range is narrowed once the bracket closes part of it.
          MSG
          # Three jobs write to this one file and their concurrency groups are
          # per-workflow, so two can be in flight at once — qual runs every two
          # hours and has already overlapped a drafts run. The loser of that
          # race gets a non-fast-forward rejection and raises its own issue
          # blaming the source it scrapes, which is a lie that costs a session
          # to unpick. Rebase onto whatever landed first and push again.
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "push rejected (attempt $attempt); rebasing onto origin/main"
            if ! git pull --rebase --autostash origin main; then
              git rebase --abort || true
              echo "the rebase itself conflicted — the generated blocks are meant to be"
              echo "disjoint regions of the file, so this needs a human."
              exit 1
            fi
          done
          echo "still could not push after 3 attempts"
          exit 1
