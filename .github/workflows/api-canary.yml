name: API canary

# Everything live on the page — schedules, live games, standings, logos, match
# detail — comes from an unofficial lolesports endpoint reached with a public
# key lifted from Riot's web client. When that key rotates or a payload shape
# moves, the page does not throw anything visible; it renders empty tables. So
# walk the same calls the page walks, once a day, and raise an issue when the
# answer stops looking right.
#
# 07:00 UTC, an hour behind the drafts refresh so the two never contend.

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

concurrency:
  group: api-canary
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

env:
  TITLE: 'API canary: the lolesports API has moved'
  LABEL: api-canary

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Probe the API
        id: probe
        run: |
          # not piped into tee: a pipeline reports tee's status, which is always 0
          if node tools/api-canary.mjs --report canary-report.md > canary-log.txt 2>&1; then
            echo "healthy=true" >> "$GITHUB_OUTPUT"
          else
            echo "healthy=false" >> "$GITHUB_OUTPUT"
          fi
          cat canary-log.txt
          {
            echo '```'
            cat canary-log.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # A single long-lived issue, updated in place — a multi-day outage should
      # not produce a multi-day pile of identical issues.
      - name: Report
        uses: ./.github/actions/report-issue
        with:
          healthy: ${{ steps.probe.outputs.healthy }}
          label: ${{ env.LABEL }}
          title: ${{ env.TITLE }}
          body-file: canary-report.md
          description: Raised automatically when the lolesports API stops matching what index.html expects
          token: ${{ github.token }}

      # Only where somebody is standing there waiting for the answer. A red
      # scheduled run mails whoever last touched this file, once per run and
      # every run until the fault is fixed, which trains the reader to bin all
      # of them including the first. The issue above is the signal for a run
      # nobody is watching — the rule stale.yml and links.yml already state, and
      # the same reason they give: a permanently red badge is a badge nobody
      # reads. A push, a PR or a dispatch still goes red, because there is
      # somebody there for the red X to be an answer to.
      - name: Fail the run if the API has moved
        if: steps.probe.outputs.healthy == 'false' && github.event_name != 'schedule'
        run: exit 1

      - name: Summarise
        if: steps.probe.outputs.healthy == 'false'
        run: echo "The API no longer matches what the page expects — see the [${{ env.LABEL }}](../issues?q=label%3A${{ env.LABEL }}) issue." >> "$GITHUB_STEP_SUMMARY"
