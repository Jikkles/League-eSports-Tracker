name: Refresh drafts

# Picks/bans, and full scoreboards for the games missing from Riot's live-stats
# feed, come from gol.gg — which sends no CORS headers, so the page can never
# fetch it itself. This bakes the data into index.html instead.
#
# Runs after the day's games are done everywhere: 06:00 UTC catches the previous
# day's LEC/LCS evenings and the LCK/LPL afternoons. Also runnable by hand.

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      prune:
        description: Also drop games from previous splits (run this after a split rollover)
        type: boolean
        required: false
        default: false

# never let two runs fight over the same file
concurrency:
  group: drafts
  cancel-in-progress: false

permissions:
  contents: write
  issues: write        # to raise a failed scrape rather than leave it in the Actions tab

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          # the push below may need to rebase, and a depth-1 clone has no
          # merge base to rebase onto
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      # The tournament name is discovered from gol.gg at runtime, so a split
      # rollover no longer breaks this. Pruning stays manual: it deletes, and a
      # daily job should not delete on a hunch.
      - name: Scrape gol.gg and patch index.html
        id: scrape
        # One retry, ten minutes on. gol.gg is a single OVH box with no CDN in
        # front of it, and it drops off the runners' network for a few minutes
        # at a time: on 17 and 19 September 2026 every connection timed out for
        # 3+ minutes, while stale.yml reached it fine an hour later on both
        # days. A daily job that gives up after 30 seconds of retries turns
        # each of those blips into a lost day and an issue. The tool writes
        # nothing until it has finished, so running it again is safe.
        run: |
          : > drafts-log.txt
          for attempt in 1 2; do
            echo "--- attempt $attempt" >> drafts-log.txt
            if node tools/drafts.mjs ${{ inputs.prune && '--prune' || '' }} >> drafts-log.txt 2>&1; then
              healthy=true; break
            fi
            healthy=false
            if [ "$attempt" = 1 ]; then sleep 600; fi
          done
          echo "healthy=$healthy" >> "$GITHUB_OUTPUT"
          cat drafts-log.txt
          {
            echo '```'
            cat drafts-log.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # tools/check.mjs supersedes the hand-rolled parse check that used to live
      # here: it validates the rewritten DRAFTS block as JSON, not just as syntax,
      # which is the failure mode a bad write actually produces.
      #
      # A check that fails here is as much a failed refresh as an unreachable
      # source — the block has been rewritten in the working copy and it is not
      # fit to push — so it goes through the same report rather than straight to
      # a red run. On its own it used to fail the job with no issue behind it
      # and nothing but an Actions email to say so; see qual.yml, where exactly
      # that went unread for a week.
      - name: Check the page still parses
        id: verify
        if: steps.scrape.outputs.healthy == 'true'
        run: |
          if node tools/check.mjs > check-log.txt 2>&1; then
            echo "healthy=true" >> "$GITHUB_OUTPUT"
          else
            echo "healthy=false" >> "$GITHUB_OUTPUT"
          fi
          cat check-log.txt
          {
            echo "--- tools/check.mjs"
            cat check-log.txt
          } >> drafts-log.txt
          {
            echo '```'
            cat check-log.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # One verdict for the two ways this job can fail, because the issue below
      # takes one flag. A skipped verify step reports an empty string, which is
      # the scrape having failed first.
      - name: Settle the verdict
        id: verdict
        env:
          SCRAPE: ${{ steps.scrape.outputs.healthy }}
          VERIFY: ${{ steps.verify.outputs.healthy }}
        run: |
          if [ "$SCRAPE" = true ] && [ "$VERIFY" = true ]; then
            echo "healthy=true" >> "$GITHUB_OUTPUT"
          else
            echo "healthy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Write the report
        if: steps.verdict.outputs.healthy == 'false'
        env:
          SCRAPE: ${{ steps.scrape.outputs.healthy }}
        run: |
          {
            if [ "$SCRAPE" != true ]; then
              echo "The daily drafts refresh failed, so [index.html](../blob/main/index.html) is no longer picking up new picks/bans."
              echo
              echo "Nothing on the page is broken — it renders what it already has, and simply carries no draft for games played since. gol.gg being briefly unreachable is the usual cause and clears on its own."
            else
              echo "\`tools/drafts.mjs\` ran, but the file it wrote does not pass \`tools/check.mjs\`, so nothing has been committed and the live page is unaffected."
              echo
              echo "A scrape that parses and a file that checks out are two different questions, and this is the second one failing: the DRAFTS block was rewritten and the result is not fit to push. The likeliest causes are the block having grown past the size ceiling and gol.gg having started serving a shape the parser reads as JSON but the page cannot use. \`check.mjs\`'s message below says which."
            fi
            echo
            echo '```'
            cat drafts-log.txt
            echo '```'
            echo
            echo "Reproduce locally with \`node tools/drafts.mjs --dry-run\`."
            echo
            echo "<sub>Posted by [drafts.yml](../blob/main/.github/workflows/drafts.yml). Updated in place on each run, and closed automatically once a scrape succeeds.</sub>"
          } > drafts-report.md

      - name: Report
        uses: ./.github/actions/report-issue
        with:
          healthy: ${{ steps.verdict.outputs.healthy }}
          label: drafts-failing
          title: 'Drafts: the gol.gg refresh is failing'
          body-file: drafts-report.md
          color: 'FBCA04'
          description: Raised automatically when the daily pick/ban scrape cannot complete
          token: ${{ github.token }}

      # Only where somebody is standing there waiting for the answer. A red
      # scheduled run mails whoever last touched this file, once per run, for as
      # long as the fault lasts — which trains the reader to bin all of them
      # including the first. The issue above is the signal, the same rule
      # stale.yml and links.yml already state. A dispatch stays red, because the
      # person who clicked it is watching the tab.
      - name: Stop here if the run failed
        if: steps.verdict.outputs.healthy == 'false' && github.event_name != 'schedule'
        run: exit 1

      - name: Summarise
        if: steps.verdict.outputs.healthy == 'false'
        run: echo "The refresh did not land — see the [drafts-failing](../issues?q=label%3Adrafts-failing) issue." >> "$GITHUB_STEP_SUMMARY"

      # Nothing below this line may run on a failed refresh, and until now
      # nothing had to say so: the exit above stopped the job outright. It no
      # longer does on a schedule, so the guard has to be here.
      - name: Commit if anything changed
        if: steps.verdict.outputs.healthy == 'true'
        run: |
          # drafts.mjs records what gol.gg currently calls each split, and
          # updates that record itself when the name moves — so it is part of
          # the commit, not just index.html.
          if git diff --quiet -- index.html tools/drafts.mjs; then
            echo "no new games; nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tools/drafts.mjs
          git commit -m "${{ inputs.prune && 'Refresh drafts from gol.gg and prune the previous split' || 'Refresh drafts from gol.gg' }}"
          # Three jobs write to this one file and their concurrency groups are
          # per-workflow, so two can be in flight at once — qual runs every two
          # hours and has already overlapped a drafts run. The loser of that
          # race gets a non-fast-forward rejection and raises its own issue
          # blaming the source it scrapes, which is a lie that costs a session
          # to unpick. Rebase onto whatever landed first and push again.
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "push rejected (attempt $attempt); rebasing onto origin/main"
            if ! git pull --rebase --autostash origin main; then
              git rebase --abort || true
              echo "the rebase itself conflicted — the generated blocks are meant to be"
              echo "disjoint regions of the file, so this needs a human."
              exit 1
            fi
          done
          echo "still could not push after 3 attempts"
          exit 1
