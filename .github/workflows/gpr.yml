name: Refresh power rankings

# The home tab's rankings board is a mirror of lolesports.com's official Global
# Power Rankings, which is a Next.js page rather than an API: 2 MB of
# server-rendered payload, behind a GraphQL endpoint that only accepts persisted
# operation IDs. The page can never fetch that itself, so this bakes it in — the
# same arrangement drafts.yml has with gol.gg.
#
# 07:45 UTC, after Riot's own board recalculates overnight and before stale.yml
# runs at 08:00, so a fresh mirror is what the staleness report sees.

on:
  schedule:
    - cron: '45 7 * * *'
  workflow_dispatch:
    inputs:
      top:
        description: How many teams the board carries
        type: string
        required: false
        default: '10'

# index.html is rewritten in place; never let two jobs race for it
concurrency:
  group: gpr
  cancel-in-progress: false

permissions:
  contents: write
  issues: write        # to raise a failed scrape rather than leave it in the Actions tab

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          # the push below may need to rebase, and a depth-1 clone has no
          # merge base to rebase onto
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Scrape the Global Power Rankings and patch index.html
        id: scrape
        # One retry, ten minutes on, for the same reason as drafts.yml: an
        # upstream that is unreachable for a few minutes should not cost a
        # day's run and an issue. Nothing is written until the tool finishes.
        run: |
          : > gpr-log.txt
          for attempt in 1 2; do
            echo "--- attempt $attempt" >> gpr-log.txt
            if node tools/gpr.mjs --top "${{ inputs.top || '10' }}" >> gpr-log.txt 2>&1; then
              healthy=true; break
            fi
            healthy=false
            if [ "$attempt" = 1 ]; then sleep 600; fi
          done
          echo "healthy=$healthy" >> "$GITHUB_OUTPUT"
          cat gpr-log.txt
          {
            echo '```'
            cat gpr-log.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The block is rewritten wholesale, so a bad write is a broken page. Check
      # before committing, not after.
      #
      # A check that fails here is as much a failed refresh as an unreachable
      # source — the block has been rewritten in the working copy and it is not
      # fit to push — so it goes through the same report rather than straight to
      # a red run. On its own it used to fail the job with no issue behind it
      # and nothing but an Actions email to say so; see qual.yml, where exactly
      # that went unread for a week.
      - name: Check the page still parses
        id: verify
        if: steps.scrape.outputs.healthy == 'true'
        run: |
          if node tools/check.mjs > check-log.txt 2>&1; then
            echo "healthy=true" >> "$GITHUB_OUTPUT"
          else
            echo "healthy=false" >> "$GITHUB_OUTPUT"
          fi
          cat check-log.txt
          {
            echo "--- tools/check.mjs"
            cat check-log.txt
          } >> gpr-log.txt
          {
            echo '```'
            cat check-log.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # One verdict for the two ways this job can fail, because the issue below
      # takes one flag. A skipped verify step reports an empty string, which is
      # the scrape having failed first.
      - name: Settle the verdict
        id: verdict
        env:
          SCRAPE: ${{ steps.scrape.outputs.healthy }}
          VERIFY: ${{ steps.verify.outputs.healthy }}
        run: |
          if [ "$SCRAPE" = true ] && [ "$VERIFY" = true ]; then
            echo "healthy=true" >> "$GITHUB_OUTPUT"
          else
            echo "healthy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Write the report
        if: steps.verdict.outputs.healthy == 'false'
        env:
          SCRAPE: ${{ steps.scrape.outputs.healthy }}
        run: |
          {
            if [ "$SCRAPE" != true ]; then
              echo "The daily power-rankings refresh failed, so the board on the home tab of [index.html](../blob/main/index.html) is frozen at whatever it last mirrored."
              echo
              echo "Nothing on the page is broken — it renders the rankings it already has, with the \`as of\` date to say how old they are. lolesports.com being briefly unreachable is the usual cause and clears on its own."
              echo
              echo "If it does not clear, the likely cause is the one this scrape cannot survive: lolesports.com is a Next.js app and the board is read out of the Apollo payload its HTML ships inline. A redesign that moves or renames that payload shows up here as \`No teamGPR payload\`, and \`sliceJSONArray\` in [tools/gpr.mjs](../blob/main/tools/gpr.mjs) is what needs re-pointing."
            else
              echo "\`tools/gpr.mjs\` ran, but the board it wrote does not pass \`tools/check.mjs\`, so nothing has been committed and the live page is still serving the last board that did."
              echo
              echo "This is the half that does not clear on its own: the scrape succeeded, so lolesports.com is up and answering, and what it handed back is a board \`check.mjs\` will not accept. \`check.mjs\`'s message below names the field."
            fi
            echo
            echo '```'
            cat gpr-log.txt
            echo '```'
            echo
            echo "Reproduce locally with \`node tools/gpr.mjs --dry-run\`."
            echo
            echo "<sub>Posted by [gpr.yml](../blob/main/.github/workflows/gpr.yml). Updated in place on each run, and closed automatically once a scrape succeeds.</sub>"
          } > gpr-report.md

      - name: Report
        uses: ./.github/actions/report-issue
        with:
          healthy: ${{ steps.verdict.outputs.healthy }}
          label: gpr-failing
          title: 'Power rankings: the lolesports GPR mirror is failing'
          body-file: gpr-report.md
          color: FBCA04
          description: Raised automatically when the daily Global Power Rankings scrape cannot complete
          token: ${{ github.token }}

      # Only where somebody is standing there waiting for the answer. A red
      # scheduled run mails whoever last touched this file, once per run, for as
      # long as the fault lasts — which trains the reader to bin all of them
      # including the first. The issue above is the signal, the same rule
      # stale.yml and links.yml already state. A dispatch stays red, because the
      # person who clicked it is watching the tab.
      - name: Stop here if the run failed
        if: steps.verdict.outputs.healthy == 'false' && github.event_name != 'schedule'
        run: exit 1

      - name: Summarise
        if: steps.verdict.outputs.healthy == 'false'
        run: echo "The refresh did not land — see the [gpr-failing](../issues?q=label%3Agpr-failing) issue." >> "$GITHUB_STEP_SUMMARY"

      # Nothing below this line may run on a failed refresh, and until now
      # nothing had to say so: the exit above stopped the job outright. It no
      # longer does on a schedule, so the guard has to be here.
      - name: Commit if anything changed
        if: steps.verdict.outputs.healthy == 'true'
        run: |
          if git diff --quiet -- index.html; then
            echo "board unchanged; nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refresh the power rankings from lolesports.com"
          # Three jobs write to this one file and their concurrency groups are
          # per-workflow, so two can be in flight at once — qual runs every two
          # hours and has already overlapped a drafts run. The loser of that
          # race gets a non-fast-forward rejection and raises its own issue
          # blaming the source it scrapes, which is a lie that costs a session
          # to unpick. Rebase onto whatever landed first and push again.
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "push rejected (attempt $attempt); rebasing onto origin/main"
            if ! git pull --rebase --autostash origin main; then
              git rebase --abort || true
              echo "the rebase itself conflicted — the generated blocks are meant to be"
              echo "disjoint regions of the file, so this needs a human."
              exit 1
            fi
          done
          echo "still could not push after 3 attempts"
          exit 1
